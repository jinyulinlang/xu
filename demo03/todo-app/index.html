<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待办事项 (Todo)</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <header>
    <h1>我的待办事项</h1>
  </header>

  <main>
    <div class="wrap">
      <section aria-labelledby="add-label">
        <h2 id="add-label" class="visually-hidden">添加新任务</h2>
        <form id="todo-form" aria-describedby="add-desc">
          <label for="new-todo" class="visually-hidden">任务标题</label>
          <input id="new-todo" name="title" type="text" placeholder="输入新任务并按添加" required />
          <button type="submit">添加</button>
        </form>
        <p id="add-desc" class="visually-hidden">在输入框输入任务标题，点击添加或按回车提交。</p>
      </section>

      <section aria-labelledby="list-label">
        <h2 id="list-label">待办列表</h2>
        <div class="controls">
          <div class="filters" role="tablist" aria-label="过滤">
            <button data-filter="all" class="filter-btn active">全部</button>
            <button data-filter="active" class="filter-btn">未完成</button>
            <button data-filter="completed" class="filter-btn">已完成</button>
          </div>
        </div>
        <ol id="todo-list" aria-live="polite"></ol>
      </section>

      <section class="list-actions">
        <button id="clear-completed" class="action-btn">清除已完成</button>
        <button id="clear-all" class="action-btn">清除全部</button>
      </section>
    </div>
  </main>

  <footer>
    <small>示例：本页使用本地脚本管理待办。</small>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>

</html>
